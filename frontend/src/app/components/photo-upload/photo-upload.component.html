<input
  type="file"
  name="input-files"
  id="input-files"
  (change)="onFileSelect($event)"
  [disabled]="disabled"
  multiple
  accept="image/*"
  #photoupload
  />
<div class="photo-upload__btn-group">
  <button type="button" class="with-icon" (click)="photoupload.click()">
    <img class="icon" src="assets/undraw_cloud-upload.svg" alt="" />
    Fotos auswählen
  </button>
  @for (file of files; track file) {
    <button
      type="button"
      class="black-outline with-icon"
      (click)="onFileDelete(file)"
      >
      {{ file.name }}
      <img class="trailing-icon" src="assets/undraw_circled-x.svg" alt="" />
    </button>
  }
</div>
