<div class="overview__wrapper">
  <div class="overview__result-grid">
    @for (o of offers; track o) {
      <app-offer-card
        (click)="openOffer(o)"
        class="overview__result-item"
        [offer]="o"
      ></app-offer-card>
    }
  </div>

  @if (page * perPage <= offers.length) {
    <button
      class="block"
      (click)="loadOffers()"
      >
      Mehr Laden
    </button>
  }
</div>
